<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DigitalFrame control</title>
</head>
<body>
  <h1>DigitalFrame control</h1>
  <p>Current duration: $current seconds per photo.</p>
  <form method="post" action="/settings">
    <label for="seconds">Seconds per photo</label>
    <input id="seconds" name="display_seconds" type="text" inputmode="numeric"
           value="$value" aria-describedby="error">
    <button type="submit">Apply</button>
  </form>
  <form method="post" action="/folder">
    <label for="folder">Photo folder</label>
    <select id="folder" name="folder" aria-describedby="error">$folder_options</select>
    <button type="submit">Apply folder</button>
  </form>
  <p id="error" role="alert">$error</p>
  <p>Changes apply from the next photo. Restarting restores the configured duration and All folders.</p>
  <p>Refresh this page after syncing to see added or renamed folders.</p>
</body>
</html>
