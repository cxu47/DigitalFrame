[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digitalframe"
version = "0.1.0"
description = "A self-updating digital photo frame with Alibaba OSS synchronization"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "google-api-python-client==2.199.0",
    "google-auth[requests]==2.56.3",
    "google-auth-oauthlib==1.4.0",
    "pillow==12.3.0",
    # Retain the Banana Pi/Armbian compatibility pin from commit 2125050.
    "pillow_heif==1.4.0",
    "python-dotenv==1.2.3",
    "typer==0.27.2",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "python-multipart==0.0.32",
    "starlette==1.6.0",
    "httplib2==0.32.0",
    "google-auth-httplib2==0.4.1",
    "alibabacloud-oss-v2==1.4.0",
]

[project.scripts]
digitalframe = "client.cli:main"

[dependency-groups]
# Tooling for the practical, offline test suite.
dev = [
    "click==8.4.2",
    "httpx2==2.13.0",
    "pytest==9.1.1",
]

[tool.setuptools]
packages = ["client", "client.storage", "client.control", "client.network"]
include-package-data = false

[tool.setuptools.package-data]
"client.control" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
